<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4f46e5">
<meta name="format-detection" content="telephone=no">
<title>가계부</title>
<style>
/* ===== 색·글자 기본값 (라이트) ===== */
:root{
  --bg:#f1f0f7; --card:#fff; --text:#1f1d2e; --muted:#6b6880; --line:#e8e6f1; --chip:#f3f2f9;
  --p:#4f46e5; --p-ink:#4f46e5; --p-soft:#eceefe; --inc:#0e9f6e; --warn:#f59e0b; --bad:#e5484d;
  --shadow:0 6px 20px rgba(79,70,229,.07),0 1px 3px rgba(20,20,40,.05); color-scheme:light;
}
/* ===== 다크 모드 ===== */
[data-theme=dark]{
  --bg:#111019; --card:#1c1b29; --text:#eceaf6; --muted:#a3a0ba; --line:#2e2c42; --chip:#262539;
  --p-ink:#a5b4fc; --p-soft:#27254a; --inc:#34d399; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#111019; --card:#1c1b29; --text:#eceaf6; --muted:#a3a0ba; --line:#2e2c42; --chip:#262539;
    --p-ink:#a5b4fc; --p-soft:#27254a; --inc:#34d399; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:18px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:15px} .inc{color:var(--inc)} .bad{color:var(--bad)} .warnc{color:var(--warn)}
h2{font-size:20px;margin:0 0 12px} h3{font-size:18px;margin:0 0 10px}
/* ===== 상단 ===== */
#top{position:sticky;top:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top);margin:0 -16px;}
.topbar{display:flex;align-items:center;justify-content:center;gap:8px;height:64px;padding:0 16px}
.topbar h1{font-size:22px;margin:0}
.mnav{width:52px;height:52px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:28px;line-height:1;color:var(--p-ink)}
.mlabel{border:0;background:none;font-size:22px;font-weight:800;min-width:150px;height:52px}
/* ===== 카드 ===== */
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin:0 0 14px}
.card.tight{padding:14px 16px}
.sum .lbl{color:var(--muted);font-size:17px}
.sum .big{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.sum .cmp{font-size:16px;margin-top:2px}
.up{color:var(--bad)} .down{color:var(--inc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.row2>div{background:var(--chip);border-radius:16px;padding:12px 14px}
.row2 span{display:block;color:var(--muted);font-size:15px}
.row2 b{font-size:22px}
.bar{height:14px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--p);transition:width .4s}
.bar.mid>i{background:var(--warn)} .bar.over>i{background:var(--bad)}
.banner{background:linear-gradient(135deg,#eef0ff,#f7f1ff);border:1px solid #dcd9fb}
[data-theme=dark] .banner{background:var(--p-soft);border-color:#3b3870}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .banner{background:var(--p-soft);border-color:#3b3870}}
.banner p{margin:6px 0 4px;font-size:16px}
.link{border:0;background:none;color:var(--p-ink);font-weight:700;padding:8px 0;font-size:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-h h2{margin:0}
/* ===== 내역 한 줄 ===== */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 2px;border-bottom:1px solid var(--line);min-height:64px}
.tx:last-child{border-bottom:0}
.tx .ico{width:46px;height:46px;flex:none;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:24px}
.tx .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .m{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-size:22px;font-weight:800;white-space:nowrap}
.tx .amt.income{color:var(--inc)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 2px;font-weight:700;color:var(--muted);font-size:16px}
.dayh b{color:var(--text);font-size:17px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .e{font-size:44px;display:block}
/* ===== 버튼 ===== */
.btn{min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:10px 18px;font-weight:700;font-size:18px}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.danger{color:var(--bad);border-color:rgba(229,72,77,.4)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;font-size:16px;padding:6px 14px;border-radius:14px}
.btn:disabled{opacity:.5}
.btn.full{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
/* ===== 칩 ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:0 16px;height:44px;font-size:16px;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:12px;min-height:48px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--p-ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg button.on.inc{color:var(--inc)}
/* ===== 입력칸 ===== */
input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{
  width:100%;min-height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:18px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{display:block}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:200px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.fl{display:block;font-weight:700;margin:16px 0 6px;font-size:17px}
.hint{font-size:15px;color:var(--muted);margin-top:6px}
.amtbox{position:relative}
.amtbox input{font-size:28px;font-weight:800;padding-right:48px;min-height:60px}
.amtbox span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cchip{border:1.5px solid var(--line);background:var(--card);border-radius:16px;min-height:70px;padding:6px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;word-break:keep-all}
.cchip span{font-size:24px}
.cchip.on{border-color:var(--p);background:var(--p-soft);color:var(--p-ink);font-weight:800}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip2{border:1.5px solid var(--line);background:var(--card);border-radius:14px;min-height:52px;font-size:17px}
.chip2.on{border-color:var(--p);background:var(--p-soft);color:var(--p-ink);font-weight:800}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
/* ===== 하단 탭 ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.05)}
#tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;height:70px;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:100%;font-size:14px;color:var(--muted)}
.tab .i{font-size:24px;line-height:1;filter:grayscale(1);opacity:.55}
.tab.on{color:var(--p-ink);font-weight:800}
.tab.on .i{filter:none;opacity:1}
.plus{justify-self:center;width:70px;height:70px;border-radius:50%;background:var(--p);color:#fff;font-size:40px;line-height:1;border:5px solid var(--bg);margin-top:-34px;box-shadow:0 10px 24px rgba(79,70,229,.45);display:grid;place-items:center}
/* ===== 시트 · 모달 ===== */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(15,12,40,.45);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.show .sheet{transform:none} .sheet-wrap.show .sheet-bg{opacity:1}
.sheet-h{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg);z-index:2;padding:12px 0 10px;margin-bottom:4px}
.sheet-h b{font-size:21px;flex:1}
.sheet-h::before{content:"";position:absolute;top:2px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:var(--line)}
.x{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-size:20px;box-shadow:var(--shadow)}
.pill{background:var(--p-soft);color:var(--p-ink);border-radius:99px;padding:2px 12px;font-weight:800;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700;padding:10px}
.opt .e{font-size:36px;line-height:1}
.quick .qrow{display:flex;gap:8px}
.quick input{flex:1}
.quick .btn{flex:none;min-width:84px}
.notice{border-radius:16px;padding:12px 14px;margin:0 0 10px;font-size:16px;background:var(--p-soft);white-space:pre-line}
.notice.warn{background:rgba(245,158,11,.15)} .notice.err{background:rgba(229,72,77,.13)} .notice.ok{background:rgba(14,159,110,.12)}
.photo{display:block;width:100%;border:0;padding:0;background:var(--card);border-radius:18px;overflow:hidden;position:relative;margin-bottom:6px;box-shadow:var(--shadow)}
.photo img{display:block;width:100%;max-height:200px;object-fit:cover}
.photo span{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:4px 12px;font-size:14px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.loading{text-align:center}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--p-soft);border-top-color:var(--p);margin:4px auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(15,12,40,.5)}
.modal .box{background:var(--card);border-radius:22px;padding:22px 20px 18px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 18px;white-space:pre-line;font-size:18px}
#viewer{position:fixed;inset:0;z-index:400;background:#000;overflow:auto;display:none;touch-action:pinch-zoom pan-x pan-y}
#viewer img{width:100%;display:block;margin:auto}
#viewer .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.9);color:#000}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:500;background:#25223a;color:#fff;padding:14px 20px;border-radius:18px;font-size:17px;max-width:min(92vw,520px);width:max-content;white-space:pre-line;text-align:center;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{background:#c2410c} #toast.err{background:#b91c1c}
/* ===== 달력 ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:14px;color:var(--muted);padding:4px 0}
.cal .wd:first-child{color:var(--bad)}
.cd{border:0;border-radius:12px;min-height:58px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--chip);font-size:15px;line-height:1.2}
.cd.blank{background:none}
.cd .v{font-size:11.5px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.cd.sel{outline:3px solid var(--p);outline-offset:-1px}
.cd.today .n{background:var(--p);color:#fff;border-radius:99px;padding:0 6px}
.cd.dark{color:#fff}
/* ===== 통계 ===== */
.donutbox{max-width:300px;margin:0 auto}
.donut path{cursor:pointer;transition:transform .2s,opacity .2s;transform-origin:100px 100px}
.donut path.dim{opacity:.35} .donut path.on{transform:scale(1.05)}
.donut text{fill:var(--text);text-anchor:middle;pointer-events:none}
.legend{display:flex;flex-direction:column;margin-top:12px}
.lg{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:52px}
.lg:last-child{border:0}
.lg i{width:14px;height:14px;border-radius:5px;flex:none}
.lg .n{flex:1} .lg .pc{color:var(--muted);font-size:15px;width:48px;text-align:right} .lg b{min-width:96px;text-align:right}
.lg.on{background:var(--p-soft);border-radius:12px}
.bars text{fill:var(--muted);font-size:12px;text-anchor:middle}
.bars text.v{fill:var(--text);font-weight:700;font-size:11.5px}
.bars g{cursor:pointer}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--chip);margin:6px 0 12px}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .no{width:30px;height:30px;border-radius:10px;background:var(--p-soft);color:var(--p-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.rank .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{white-space:nowrap}
.mini{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--p)}
/* ===== 설정 ===== */
details.set{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
details.set>summary{list-style:none;padding:18px 20px;font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px;min-height:64px;cursor:pointer}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"›";margin-left:auto;font-size:26px;color:var(--muted);transition:transform .2s}
details.set[open]>summary::after{transform:rotate(90deg)}
details.set .body{padding:0 20px 20px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0;word-break:keep-all}
.li .n small{display:block;color:var(--muted);font-size:14px}
.radio{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;font-size:18px}
.radio input{width:24px;height:24px;accent-color:var(--p);flex:none}
.check{display:flex;align-items:center;gap:10px;font-size:16px;margin-top:10px}
.check input{width:22px;height:22px;accent-color:var(--p)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:99px;padding:6px 6px 6px 12px;margin:0 6px 8px 0;font-size:16px}
.tag button{border:0;background:var(--card);border-radius:50%;width:30px;height:30px;font-size:14px;color:var(--bad)}
.budrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.budrow span{flex:1;font-size:17px}
.budrow input{flex:none;width:150px;text-align:right}
/* ===== 잠금 화면 ===== */
#lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.pin{width:100%;max-width:340px;text-align:center}
.pin-t{font-size:22px;font-weight:800;margin-bottom:4px}
.pin-s{color:var(--muted);min-height:27px;font-size:16px}
.dots{display:flex;gap:18px;justify-content:center;margin:22px 0 28px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--p);display:block}
.dots i.f{background:var(--p)}
.dots.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:68px;border-radius:20px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:26px;font-weight:700}
.pad button.ghost{background:none;box-shadow:none;font-size:14px;color:var(--muted);word-break:keep-all;line-height:1.3}
.stack-btns{display:flex;flex-direction:column;gap:10px}
@media (min-width:600px){ .sheet{border-radius:24px;margin-bottom:16px} }

</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="메뉴">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="home"><span class="i">🏠</span>홈</button>
    <button class="tab" data-act="tab" data-tab="list"><span class="i">📋</span>내역</button>
    <button class="plus" data-act="plus" aria-label="새 내역 추가">＋</button>
    <button class="tab" data-act="tab" data-tab="stats"><span class="i">📊</span>통계</button>
    <button class="tab" data-act="tab" data-tab="settings"><span class="i">⚙️</span>설정</button>
  </div>
</nav>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="viewer"><button class="x" data-act="viewerClose" aria-label="닫기">✕</button><img alt="영수증 크게 보기" data-act="viewerClose"></div>
<div id="lock" hidden></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
"use strict";
/* =====================================================================
   1) 순수 도우미: 날짜 · 숫자 · 글자 해석 (화면과 무관한 계산 함수들)
   ===================================================================== */
const WD = ['일','월','화','수','목','금','토'];
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ const a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function todayStr(){ return ymd(new Date()); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+Number(n)); return ymd(d); }
function dayDiff(a,b){ return Math.round((parseYmd(a)-parseYmd(b))/86400000); }
function ymAdd(ym,n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+pad(m); }
function lastDay(ym){ return new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate(); }
function validDate(y,m,d){ if(!(y>1900&&m>=1&&m<=12&&d>=1&&d<=31)) return false; const t=new Date(y,m-1,d); return t.getMonth()===m-1; }
/* 월/일 → 'YYYY-MM-DD'. 연도가 없으면 올해, 그 날짜가 미래면 작년 */
function mdToDate(m,d,y,today){
  const t=today||todayStr(); let yy=y||+t.slice(0,4);
  if(!validDate(yy,m,d)) return null;
  let s=yy+'-'+pad(m)+'-'+pad(d);
  if(!y && s>t){ yy--; if(!validDate(yy,m,d)) return null; s=yy+'-'+pad(m)+'-'+pad(d); }
  return s;
}
function normDate(v){
  const m=String(v||'').match(/(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/);
  if(!m) return null; return validDate(+m[1],+m[2],+m[3]) ? m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]) : null;
}
function prevWeekday(t,wd,strict){ const d=parseYmd(t); let diff=(d.getDay()-wd+7)%7; if(diff===0&&strict) diff=7; return addDays(t,-diff); }
function lastWeekDay(t,wd){ const d=parseYmd(t); const mon=addDays(t,-((d.getDay()+6)%7)); return addDays(addDays(mon,-7),(wd+6)%7); }

/* 한글 숫자 읽기: 만오천 → 15000, 1만2천 → 12000, 4천5백 → 4500, 1.5만 → 15000 */
const KD={'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'륙':6,'칠':7,'팔':8,'구':9};
const KSU={'십':10,'백':100,'천':1000}, KBU={'만':1e4,'억':1e8};
function parseKoNum(str){
  const s=String(str==null?'':str).replace(/[,\s원]/g,'');
  if(!s) return null;
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const re=/(\d+(?:\.\d+)?)|([영공일이삼사오육륙칠팔구])|([십백천])|([만억])/g;
  let total=0, section=0, num=null, m, pos=0;
  while((m=re.exec(s))){
    if(m.index!==pos) return null; pos=m.index+m[0].length;
    if(m[1]) num=parseFloat(m[1]);
    else if(m[2]) num=KD[m[2]];
    else if(m[3]){ section+=(num===null?1:num)*KSU[m[3]]; num=null; }
    else { section+=(num===null?0:num); total+=(section||1)*KBU[m[4]]; section=0; num=null; }
  }
  if(pos!==s.length) return null;
  return Math.round(total+section+(num||0));
}

/* 사용처 이름 정리(학습·중복 비교용): 공백·지점명·(주) 제거 */
function normMerchant(s){
  let x=String(s||'').toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사/g,' ').trim();
  x=x.replace(/\s*[\(\[][^)\]]*[\)\]]\s*$/,'');
  const parts=x.split(/\s+/).filter(Boolean);
  const multi=parts.length>1;
  if(multi && /(점|지점|센터|매장)$/.test(parts[parts.length-1])) parts.pop();
  x=parts.join('');
  if(!multi && /점$/.test(x) && !/(편의점|백화점|할인점|본점)$/.test(x)){ const n=/역점$/.test(x)?4:3; if(x.length-n>=2) x=x.slice(0,-n); }
  return x.replace(/[^0-9a-z가-힣&+]/g,'');
}
function similarMerchant(a,b){
  const x=normMerchant(a), y=normMerchant(b);
  if(!x||!y) return !x&&!y;
  return x===y||x.includes(y)||y.includes(x)||(x.length>=2&&y.length>=2&&x.slice(0,2)===y.slice(0,2));
}

const NUMCH='(?:\\d[\\d,]*(?:\\.\\d+)?(?![\\d,])|[일이삼사오육칠팔구십백천])';
function findWonAmount(s){
  const re=new RegExp('((?:'+NUMCH+'*[만억]\\s?)*'+NUMCH+'*)\\s*원','g'); let m;
  while((m=re.exec(s))){
    const raw=m[1].trim(); if(!raw) continue;
    if(/^[일이삼사오육칠팔구]$/.test(raw)) continue;   // '사원' 같은 낱말 제외
    const v=parseKoNum(raw); if(v&&v>0) return {v,str:m[0]};
  }
  return null;
}
function parseQuick(input,today){
  const t=today||todayStr();
  let s=' '+String(input||'').replace(/\s+/g,' ').trim()+' ';
  const r={type:'expense',date:t,amount:null,merchant:'',memo:'',payment:null,hintCat:null};
  if(/월급|급여|용돈|입금|받았|보너스|상여/.test(s)) r.type='income';
  /* 날짜 */
  let found=false;
  const tryD=(re,fn)=>{ if(found) return; const m=s.match(re); if(!m) return; const d=fn(m); if(d){ r.date=d; s=s.replace(m[0],' '); found=true; } };
  tryD(/(20\d{2})\s*[.\/\-년]\s*(\d{1,2})\s*[.\/\-월]\s*(\d{1,2})\s*일?/, m=>mdToDate(+m[2],+m[3],+m[1],t));
  tryD(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/, m=>mdToDate(+m[1],+m[2],0,t));
  tryD(/(^|[^\d,.])(\d{1,2})\/(\d{1,2})(?![\d\/])/, m=>mdToDate(+m[2],+m[3],0,t));
  tryD(/(\d{1,3})\s*일\s*전/, m=>addDays(t,-m[1]));
  tryD(/(일주일|한\s*주)\s*전/, ()=>addDays(t,-7));
  tryD(/엊그저께|엊그제|그저께|그제/, ()=>addDays(t,-2));
  tryD(/어제/, ()=>addDays(t,-1));
  tryD(/오늘/, ()=>t);
  tryD(/지난\s*주\s*([월화수목금토일])요일/, m=>lastWeekDay(t,WD.indexOf(m[1])));
  tryD(/지난\s*([월화수목금토일])요일/, m=>prevWeekday(t,WD.indexOf(m[1]),true));
  tryD(/(?:이번\s*주\s*)?([월화수목금토일])요일/, m=>prevWeekday(t,WD.indexOf(m[1]),false));
  /* 금액 */
  let best=findWonAmount(s);
  if(!best){
    const m2=s.match(/\d[\d,]*(?:\.\d+)?(?![\d,.])\s?[만천](?:\s?\d+\s?[천백])?|\d{1,3}(?:,\d{3})+(?![\d,])|\d{3,}(?![\d,])/);
    if(m2){ const v=parseKoNum(m2[0]); if(v>0) best={v,str:m2[0]}; }
  }
  if(best){ r.amount=best.v; s=s.replace(best.str,' '); }
  /* 결제수단 */
  const PAYRE=[
    ['현금',/현금(으로)?/g],
    ['계좌이체',/계좌\s*이체(로)?|이체(로)?|송금/g],
    ['간편결제',/(카카오|네이버|토스|삼성|애플|스마일|쿠팡)\s*페이(로)?|페이코|payco|간편\s*결제(로)?/gi],
    ['카드',/(신용|체크)?\s*카드(로)?/g]
  ];
  for(const [p,re] of PAYRE){ if(s.search(re)>=0){ if(!r.payment) r.payment=p; s=s.replace(re,' '); } }
  if(!r.payment) r.payment=r.type==='income'?'계좌이체':'카드';
  /* 식사 단어 → 메모 */
  const memo=[];
  s=s.replace(/(아침|점심|저녁|야식|브런치|회식|간식)(밥|식사)?/g, w=>{ memo.push(w); return ' '; });
  if(memo.length){ r.memo=memo.join(' '); r.hintCat=/간식/.test(r.memo)&&memo.length===1?'카페·간식':'식비'; }
  /* 동사·조사 정리 → 남은 글자가 사용처 */
  s=s.replace(/(썼어요|썼어|썼음|썼다|샀어요|샀어|샀음|결제했어요|결제했어|결제함|결제|냈어요|냈어|먹었어요|먹었어|마셨어요|마셨어|받았어요|받았어|받았음|받음|입금됨|입금|지출|구매|탔어요|탔어|했어요|했어)/g,' ');
  s=s.replace(/([가-힣A-Za-z0-9]+?)(에서|으로|에게|한테)(?=\s|$)/g,'$1');
  s=s.replace(/(^|\s)(에서|으로|원)(?=\s|$)/g,' ').replace(/[,.!?~]+/g,' ');
  r.merchant=s.replace(/\s+/g,' ').trim();
  return r;
}

  }

/* 반복 결제 감지: 최근 6개월 지출을 사용처별로 묶어 확인 */
function detectRecurring(){
  const t=todayStr(), cur=t.slice(0,7), from=ymAdd(cur,-5);
  const fixedKeys=new Set(FIXED.map(f=>normMerchant(f.name))), ign=new Set(IGN), groups={};
  for(const x of TX){
    if(x.type!=='expense'||x.source==='recurring') continue;
    const ym=x.date.slice(0,7); if(ym<from||ym>cur) continue;
    const k=normMerchant(x.merchant); if(!k||fixedKeys.has(k)||ign.has(k)) continue;
    (groups[k]=groups[k]||[]).push(x);
  }
  const out=[];
  for(const k in groups){
    const byM={}; for(const x of groups[k]) (byM[x.date.slice(0,7)]=byM[x.date.slice(0,7)]||[]).push(x);
    let run=[], ym=cur;
    if(!byM[ym]) ym=ymAdd(cur,-1);              // 이번 달이 아직 안 지났으면 지난달부터
    while(byM[ym]&&byM[ym].length===1&&ym>=from){ run.unshift(byM[ym][0]); ym=ymAdd(ym,-1); }
    if(run.length<2) continue;
    const amts=run.map(x=>x.amount), days=run.map(x=>+x.date.slice(8));
    const ok1=run.length>=3 && (Math.max(...amts)-Math.min(...amts))<=Math.max(...amts)*0.1 && (Math.max(...days)-Math.min(...days))<=6;
    const ok2=amts[amts.length-1]===amts[amts.length-2];
    if(!ok1&&!ok2) continue;
    const last=run[run.length-1];
    out.push({key:k,name:last.merchant,amount:last.amount,day:+last.date.slice(8),cat:last.cat,payment:last.payment,n:run.length,thisMonth:!!byM[cur]});
  }
  return out.sort((a,b)=>b.n-a.n).slice(0,3);
}

/* =====================================================================
   11) 통계 탭 (SVG 차트 직접 그리기)
   ===================================================================== */
function donutSvg(entries,total,sel){
  const R=92,r=58,c=100; let a0=-Math.PI/2, paths='';
  const P=(a,rad)=>(c+rad*Math.cos(a)).toFixed(2)+' '+(c+rad*Math.sin(a)).toFixed(2);
  for(const [cat,v] of entries){
    const frac=v/total, a1=a0+frac*Math.PI*2; let d;
    if(frac>0.9999) d=`M${c} ${c-R} A${R} ${R} 0 1 1 ${c-0.01} ${c-R} L${c-0.01} ${c-r} A${r} ${r} 0 1 0 ${c} ${c-r}Z`;
    else { const big=frac>0.5?1:0; d=`M${P(a0,R)} A${R} ${R} 0 ${big} 1 ${P(a1,R)} L${P(a1,r)} A${r} ${r} 0 ${big} 0 ${P(a0,r)}Z`; }
    paths+=`<path d="${d}" fill="${catColor(cat)}" class="${sel?(sel===cat?'on':'dim'):''}" data-act="donut" data-cat="${esc(cat)}" stroke="var(--card)" stroke-width="1.5"/>`;
    a0=a1;
  }
  let center;
  if(sel&&entries.find(e=>e[0]===sel)){ const v=entries.find(e=>e[0]===sel)[1];
    center=`<text x="100" y="84" font-size="13">${esc(catEmoji(sel))} ${esc(sel)}</text><text x="100" y="108" font-size="22" font-weight="800">${(v/total*100).toFixed(1)}%</text><text x="100" y="128" font-size="13" opacity=".75">${esc(won(v))}</text>`;
  } else center=`<text x="100" y="92" font-size="13" opacity=".75">이번 달 지출</text><text x="100" y="116" font-size="19" font-weight="800">${esc(shortWon(total))}원</text>`;
  return `<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="카테고리별 지출 도넛 차트">${paths}${center}</svg>`;
}
function barSvg(){
  const months=[0,1,2,3,4,5].map(i=>ymAdd(curYm,i-5)), vals=months.map(m=>monthStats(m).exp), max=Math.max(1,...vals);
  const W=330,H=200,top=26,bot=30,bw=34,gap=(W-6*bw)/6; let g='';
  months.forEach((m,i)=>{
    const x=gap/2+i*(bw+gap), h=Math.max(vals[i]?4:0,(H-top-bot)*vals[i]/max), y=H-bot-h, on=m===curYm;
    g+=`<g data-act="barMonth" data-ym="${m}"><rect x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent"/>
      <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="8" fill="${on?'var(--p)':'var(--p-soft)'}" stroke="${on?'none':'var(--p)'}" stroke-opacity=".25"/>
      <text class="v" x="${x+bw/2}" y="${y-7}">${vals[i]?esc(shortWon(vals[i])):''}</text><text x="${x+bw/2}" y="${H-9}" ${on?'font-weight="800" style="fill:var(--p-ink)"':''}>${+m.slice(5)}월</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="bars" role="img" aria-label="최근 6개월 지출 막대 차트">${g}</svg>`;
}
function viewStats(){
  const ms=monthStats(curYm), m=+curYm.slice(5);

  } else h+=emptyBox('💳','이 달에는 지출이 없어요.');
  h+=`</section><section class="card"><h2>⑤ 카테고리 예산</h2>`;
  const bud=CATS.expense.filter(c=>CFG.budgets[c.name]>0);
  h+= bud.length?bud.map(c=>`<div style="margin-bottom:14px">${budgetBar(ms.byCat[c.name]||0,CFG.budgets[c.name],c.emoji+' '+c.name)}</div>`).join(''):emptyBox('🎯','카테고리 예산이 없어요.<br><button class="link" data-act="goBudget">설정에서 예산 정하기 ›</button>');
  h+=`</section>`;
  return h;
}

function learnSave(merchant,cat,type,auto){
  const k=normMerchant(merchant); if(!k||merchant===cat) return null;
  const prev=LEARN[k];
  if(prev&&prev.cat===cat) return null;
  LEARN[k]={cat,name:String(merchant).trim().slice(0,40),type};
  saveLEARN();
  if((prev&&prev.cat!==cat)||(auto&&auto!==cat)) return `앞으로 '${String(merchant).trim()}'${hasBatchim(String(merchant).trim())?'은':'는'} ${eulo(cat)} 자동 분류해요`;
  return null;
}
function budgetWarn(rec){
  if(rec.type!=='expense') return null;
  const ms=monthStats(rec.date.slice(0,7)), out=[];
  if(CFG.budgetTotal>0){ const p=ms.exp/CFG.budgetTotal; if(p>=1) out.push(`⚠️ ${+rec.date.slice(5,7)}월 예산을 ${won(ms.exp-CFG.budgetTotal)} 넘었어요`); else if(p>=0.8) out.push(`예산의 ${Math.floor(p*100)}%를 썼어요`); }
  const cb=CFG.budgets[rec.cat]; if(cb>0&&(ms.byCat[rec.cat]||0)>cb) out.push(`⚠️ ${rec.cat} 예산을 ${won(ms.byCat[rec.cat]-cb)} 넘었어요`);
  return out.length?out.join('\n'):null;
}

function aiReady(){ return (CFG.ocr==='gemini'&&CFG.geminiKey)||(CFG.ocr==='claude'&&CFG.claudeKey); }
function findCancelMatch(r){
  let best=null,bd=1e9;
  for(const t of TX){
    if(t.type!=='expense'||t.amount!==r.amount) continue;
    const dd=dayDiff(r.date,t.date); if(dd<-3||dd>62) continue;
    if(r.merchant&&!similarMerchant(t.merchant,r.merchant)) continue;
    if(Math.abs(dd)<bd){ bd=Math.abs(dd); best=t; }
  }
  return best;
}
async function readSms(){
  const ta=$('#smsIn'); if(!ta) return; smsDraft=ta.value;
  const msgs=splitSms(ta.value);
  if(!msgs.length){ toast('붙여 넣은 문자가 없어요.'); return; }
  const btn=$('#smsRead'); btn.disabled=true; btn.textContent='읽는 중…';
  const items=[], skips={}, t=todayStr(); let noMatch=0;
  for(const raw of msgs){
    const r=parseSms(raw,t);
    if(r.skip){ skips[r.skip]=(skips[r.skip]||0)+1; continue; }
    const notices=[];
    if(r.amount==null&&!r.fx&&aiReady()){
      try{
        btn.textContent='AI에게 물어보는 중…';
        const a=parseAIJson(await aiRequest({text:smsPrompt()+'\n\n문자:\n'+r.redacted}));

      }catch(e){ notices.push({t:'AI로도 읽지 못했어요: '+errMsg(e),cls:'err'}); }
    }
    if(r.cancel){ const mt=r.amount!=null?findCancelMatch(r):null; if(mt) items.push({kind:'draft',draft:smsDraftOf(r),cancelMatch:mt}); else noMatch++; continue; }
    if(r.fx) notices.push({t:`💱 외화 결제(${r.fx})예요. 원화 금액은 카드 명세서를 보고 입력해 주세요.`,cls:'warn'});
    else if(r.amount==null) notices.push({t:'금액을 읽지 못했어요. 문자를 보고 직접 입력해 주세요.',cls:'warn'});
    if(!notices.length) notices.push({t:'✅ 읽은 내용을 확인하고 저장해 주세요.',cls:'ok'});
    notices.push({t:'📩 원래 문자: '+raw.replace(/\[Web발신\]\s*/g,'').slice(0,160)});
    items.push({kind:'draft',draft:smsDraftOf(r),notices});
  }
  btn.disabled=false; btn.textContent='읽기';
  const sum=Object.entries(skips).map(([k,v])=>`${k} ${v}건`); if(noMatch) sum.push(`원래 내역이 없는 취소 문자 ${noMatch}건`);

  smsDraft=''; closeSheet('sms');

  startQueue(items);
}

function drawScaled(im,max,q){
  const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height, s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);

}

    if(r.status===400&&/api.?key/i.test(m)) throw new UErr(`${label} API 키가 올바르지 않아요. 키를 다시 확인해 주세요.`);
    if(r.status===401||r.status===403) throw new UErr(`${label} API 키가 올바르지 않거나 권한이 없어요.`);
    if(r.status===404) throw new UErr(`모델 이름을 찾을 수 없어요. 설정에서 모델 이름을 확인해 주세요.`);
    if(r.status===429) throw new UErr('사용 한도를 넘었어요. 잠시 뒤 다시 하거나 요금제를 확인해 주세요.');
    if(r.status>=500) throw new UErr('AI 서버가 잠시 바빠요. 조금 뒤 다시 해 주세요.');
    throw new UErr(`요청이 거절됐어요 (${r.status}). ${m.slice(0,120)}`);
  }
  if(!j) throw new UErr('AI 답변을 읽지 못했어요.');
  return j;
}
async function aiRequest({text,image},signal){
  if(CFG.ocr==='gemini'){
    const key=(CFG.geminiKey||'').trim(); if(!key) throw new UErr('Gemini API 키가 없어요. 설정 → 영수증 인식에서 키를 넣어 주세요.');
    const model=((CFG.geminiModel||'').trim()||DEFAULT_CFG.geminiModel).replace(/^models\//,'');
    const parts=[{text}]; if(image) parts.push({inline_data:{mime_type:'image/jpeg',data:image}});
    const j=await fetchJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',signal,
      headers:{'content-type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0,responseMimeType:'application/json'}})},'Gemini');
    const out=(((j.candidates||[])[0]||{}).content||{}).parts||[];
    const txt=out.map(p=>p.text||'').join(''); if(!txt) throw new UErr('AI가 빈 답을 보냈어요. 다른 사진으로 해 보세요.');
    return txt;
  }
  if(CFG.ocr==='claude'){
    const key=(CFG.claudeKey||'').trim(); if(!key) throw new UErr('Claude API 키가 없어요. 설정 → 영수증 인식에서 키를 넣어 주세요.');
    const content=[]; if(image) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:image}}); content.push({type:'text',text});
    const j=await fetchJSON('https://api.anthropic.com/v1/messages',{method:'POST',signal,
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
      body:JSON.stringify({model:(CFG.claudeModel||'').trim()||DEFAULT_CFG.claudeModel,max_tokens:1000,messages:[{role:'user',content}]})},'Claude');
    const txt=(j.content||[]).map(c=>c.text||'').join(''); if(!txt) throw new UErr('AI가 빈 답을 보냈어요.');
    return txt;
  }
  throw new UErr('AI 인식 방식이 선택되지 않았어요.');
}
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new UErr('기기 내 OCR 프로그램을 내려받지 못했어요. 인터넷 연결을 확인해 주세요.')); }; document.head.appendChild(s); }); }
async function ocrTesseract(dataUrl,onProg){
  if(!window.Tesseract) await loadScript(TESS_URL);
  const r=await Tesseract.recognize(dataUrl,'kor+eng',{logger:m=>{ if(m&&m.status==='recognizing text') onProg(Math.round((m.progress||0)*100)); }});
  return (r&&r.data&&r.data.text)||'';
}

async function processImage(it,qpos){
  openForm(blankDraft('receipt'),{qpos,loading:'사진을 준비하고 있어요…'});

    const im=await loadImg(it.file);

  }catch(e){ if(!F||tok!==F.token) return; F.loading=null; F.notices=[{t:errMsg(e)+' 직접 입력해 주세요.',cls:'err'}]; rerenderForm(); return; }
  const m=CFG.ocr;
  if(m==='none'){ F.loading=null; F.notices=[{t:'영수증 자동 인식이 꺼져 있어요. 사진을 보면서 직접 입력해 주세요.\n(설정 → 영수증 인식에서 켤 수 있어요)'}]; rerenderForm(); return; }
  F.loading=m==='tesseract'?'기기 안에서 글자를 읽고 있어요…\n(처음에는 한글 글자 데이터를 내려받느라 1분쯤 걸릴 수 있어요)':'AI가 영수증을 읽고 있어요…';
  F.canStop=true; const ac=('AbortController' in window)?new AbortController():null; F.abort=ac; rerenderForm();
  try{
    let res;
    if(m==='tesseract'){
      const text=await ocrTesseract(F.photo,p=>{ if(F&&tok===F.token){ const el=$('#loadMsg'); if(el) el.textContent=`기기 안에서 글자를 읽고 있어요… ${p}%`; } });
      res=parseOcrText(text,todayStr()); res.ocr=true;
    } else res=parseAIJson(await aiRequest({text:receiptPrompt(),image:F.photo.split(',')[1]},ac&&ac.signal));

    if(res.merchant) F.merchant=res.merchant.slice(0,60);

    const n=[];
    if(res.ocr) n.push({t:'📱 기기 내 OCR은 정확도가 낮을 수 있어요. 사진과 비교해서 꼭 확인해 주세요.',cls:'warn'});
    if(res.confidence!=null&&res.confidence<0.6) n.push({t:'글씨가 흐려서 확실하지 않아요. 값을 꼭 확인해 주세요.',cls:'warn'});
    if(!res.amount) n.push({t:'금액을 읽지 못했어요. 사진을 보고 직접 입력해 주세요.',cls:'warn'});
    F.notices=n.length?n:[{t:'✅ 읽은 내용을 확인하고 저장해 주세요.',cls:'ok'}];
  }catch(e){
    if(!F||tok!==F.token) return;

  }
  F.loading=null; F.abort=null; F.canStop=false; rerenderForm();
}

/* 고정지출 자동 기록: 결제일이 지난 달 중 아직 안 쓴 달을 채움 */
function runFixed(){
  const t=todayStr(), cur=t.slice(0,7); let added=0;
  for(const f of FIXED){
    f.done=Array.isArray(f.done)?f.done:[]; if(!f.startYm) f.startYm=cur;
    let ym=f.startYm, guard=0;
    while(ym<=cur&&guard++<240){
      if(!f.done.includes(ym)){
        const d=ym+'-'+pad(Math.min(f.day,lastDay(ym)));
        if(d<=t){ TX.push({id:uid(),type:'expense',date:d,merchant:f.name,amount:f.amount,cat:f.cat,payment:f.payment||'카드',memo:'고정지출 자동 기록',source:'recurring',fixedId:f.id,createdAt:Date.now()+added}); f.done.push(ym); added++; }
      }
      ym=ymAdd(ym,1);
    }
    while(f.done.includes(f.startYm)) f.startYm=ymAdd(f.startYm,1);
    f.done=f.done.filter(m=>m>=f.startYm);
  }
  saveFIXED();
  if(added){ saveTX(); setTimeout(()=>toast(`고정지출 ${added}건을 자동으로 기록했어요 🔁`),600); }
  return added;
}

}

function lockApp(){

function pinSheet(mode,title,sub){

}
function pinDots(){ PIN.el.querySelectorAll('[data-pin=dots] i').forEach((d,i)=>d.classList.toggle('f',i<PIN.buf.length)); }
function pinWrong(msg){ const d=PIN.el.querySelector('[data-pin=dots]'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); PIN.el.querySelector('[data-pin=sub]').textContent=msg; PIN.buf=''; pinDots(); if(navigator.vibrate) navigator.vibrate(120); }
function pinPress(v){
  if(!PIN.el) return;
  if(v==='del') PIN.buf=PIN.buf.slice(0,-1); else if(PIN.buf.length<4) PIN.buf+=v;
  pinDots(); if(PIN.buf.length<4) return;
  const code=PIN.buf;
  setTimeout(()=>{
    if(PIN.mode==='unlock'){ if(pinHash(code)===CFG.pinHash){ PIN.el.hidden=true; PIN.el.innerHTML=''; PIN={mode:null,buf:'',first:'',el:null}; runFixed(); render(); } else pinWrong('PIN이 맞지 않아요. 다시 눌러 주세요.'); }
    else if(PIN.mode==='verifyOff'||PIN.mode==='verifyChg'){
      if(pinHash(code)!==CFG.pinHash) return pinWrong('지금 PIN이 맞지 않아요.');
      if(PIN.mode==='verifyOff'){ CFG.pinHash=''; saveCFG(); closeSheet('pinS'); toast('PIN 잠금을 껐어요'); render(); }
      else { PIN.first=''; pinSheet('set1','새 PIN 4자리를 눌러 주세요'); }
    }
    else if(PIN.mode==='set1'){ PIN.first=code; pinSheet('set2','한 번 더 눌러 주세요','확인을 위해 같은 PIN을 다시 눌러요'); }
    else if(PIN.mode==='set2'){
      if(code!==PIN.first){ PIN.first=''; pinSheet('set1','새 PIN 4자리를 눌러 주세요'); return pinWrong('두 번 누른 PIN이 달라요. 처음부터 다시 해 주세요.'); }
      CFG.pinHash=pinHash(code); saveCFG(); PIN={mode:null,buf:'',first:'',el:null}; closeSheet('pinS'); toast('PIN 잠금을 켰어요 🔐'); render();
    }
  },120);
}

  x.fillStyle='rgba(255,255,255,.22)'; rr(s*.24,s*.2,s*.52,s*.62,s*.08); x.fill();

  mnow:()=>{ curYm=todayStr().slice(0,7); render(); },
  hideBanner:()=>{ localStorage.setItem('gb_banner',todayStr()); render(); },
  goBudget:()=>{ tab='settings'; UI.openSec.add('budget'); render(); setTimeout(()=>{ const d=document.querySelector('[data-sec=budget]'); if(d) d.scrollIntoView({behavior:'smooth',block:'start'}); },50); },
  goSample:()=>sampleIn(),
  recReg:el=>recRegister(el.dataset.k),
  recIgn:el=>{ IGN.push(el.dataset.k); saveIGN(); toast('이 결제는 다시 보여 드리지 않을게요.\n(설정 → 무시한 반복 결제에서 되돌릴 수 있어요)','',3500); render(); },
  unIgn:el=>{ IGN=IGN.filter(k=>k!==el.dataset.k); saveIGN(); render(); },
  edit:el=>openEdit(el.dataset.id),
  lmode:el=>{ UI.listMode=el.dataset.v; render(); },
  fcatF:el=>{ UI.cat=el.dataset.v; render(); },
  fpayF:el=>{ UI.pay=el.dataset.v; render(); },
  calDay:el=>{ UI.calDay=el.dataset.d; $('#listBody').innerHTML=listBody(); },
  donut:el=>{ const c=el.dataset.cat; UI.statCat=UI.statCat===c?null:c; render(); },
  barMonth:el=>{ curYm=el.dataset.ym; UI.statCat=null; render(); },
  cam:()=>$('#fileCam').click(),
  gal:()=>$('#fileGal').click(),
  sms:()=>{ closeSheet('add'); openSms(); },
  smsRead:()=>readSms(),
  smsExample:()=>{ const ta=$('#smsIn'); if(ta){ ta.value=SMS_EXAMPLE; smsDraft=ta.value; } },
  manual:()=>{ closeSheet('add'); startQueue([{kind:'draft',draft:blankDraft('manual')}]); },
  formClose:()=>formCloseAsk(),
  ftype:el=>{ if(!F) return; F.type=el.dataset.v; F.catTouched=false; F.cat=autoCat(F.merchant,F.type)||catFor('',F.type); if(F.type==='income'&&F.payment==='카드') F.payment='계좌이체'; rerenderForm(); },
  fcat:el=>{ if(!F) return; F.cat=el.dataset.v; F.catTouched=true; $('#fCats').innerHTML=catChips(); },
  fpay:el=>{ if(!F) return; F.payment=el.dataset.v; el.parentNode.querySelectorAll('.chip2').forEach(b=>b.classList.toggle('on',b===el)); },
  save:()=>formSave(),
  skipItem:()=>{ if(Q.items.length) nextItem(); else closeForm(); },
  applyCancel:()=>applyCancel(),
  stopRecog:()=>stopRecog(),
  delTx:async()=>{ if(!F||!F.editId) return; if(!(await ask('이 내역을 삭제할까요?',{ok:'삭제',danger:true}))) return; TX=TX.filter(t=>t.id!==F.editId); saveTX(); closeForm(); toast('삭제했어요'); render(); },
  viewPhoto:()=>{ if(!F) return; const v=$('#viewer'); v.querySelector('img').src=F.photo||F.thumb; v.style.display='block'; },
  viewerClose:()=>{ const v=$('#viewer'); v.style.display='none'; v.querySelector('img').removeAttribute('src'); },
  theme:el=>{ CFG.theme=el.dataset.v; saveCFG(); applyTheme(); render(); },
  saveBudget:()=>saveBudget(),
  addFixed:()=>addFixed(),
  delFixed:async el=>{ const f=FIXED.find(x=>x.id===el.dataset.id); if(!f) return; if(!(await ask(`'${f.name}' 고정지출을 삭제할까요?\n이미 기록된 내역은 그대로 남아요.`,{ok:'삭제',danger:true}))) return; FIXED=FIXED.filter(x=>x!==f); saveFIXED(); render(); },
  delCat:el=>delCat(el.dataset.type,el.dataset.v),
  addCat:()=>addCat(),
  delLearn:el=>{ delete LEARN[el.dataset.k]; saveLEARN(); toast('지웠어요'); render(); },
  testConn:async()=>{ const o=$('#connOut'); o.textContent='확인하는 중…';
    try{ if(CFG.ocr==='none') o.textContent="인식 방식이 '사용 안 함'이에요. 위에서 방식을 골라 주세요.";
      else if(CFG.ocr==='tesseract'){ if(!window.Tesseract) await loadScript(TESS_URL); o.textContent='✅ 기기 내 OCR 프로그램을 불러왔어요. (한글 글자 데이터는 첫 인식 때 내려받아요)'; }
      else { await aiRequest({text:'연결 테스트입니다. {"ok":true} 라는 JSON만 출력하세요.'}); o.textContent=`✅ 연결 성공! ${CFG.ocr==='gemini'?'Gemini':'Claude'}를 쓸 수 있어요.`; } }
    catch(e){ o.textContent='❌ '+errMsg(e); } },
  pinSet:()=>{ PIN.first=''; pinSheet('set1','새 PIN 4자리를 눌러 주세요'); },
  pinChange:()=>pinSheet('verifyChg','지금 PIN을 눌러 주세요'),
  pinOff:()=>pinSheet('verifyOff','지금 PIN을 눌러 주세요','확인되면 잠금을 꺼요'),
  pin:el=>pinPress(el.dataset.v),
  pinForgot:()=>pinForgot(),
  noop:()=>{},
  csvOut:()=>csvOut(), csvIn:()=>$('#fileCsv').click(), jsonOut:()=>jsonOut(), jsonIn:()=>$('#fileJson').click(),
  sampleIn:()=>sampleIn(), sampleOut:()=>sampleOut(), wipe:()=>wipe()
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(!$('#lock').hidden && !el.closest('#lock') && !el.closest('.modal')) return;
  const fn=ACT[el.dataset.act]; if(!fn) return; e.preventDefault(); fn(el,e);
});
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.dataset.form==='quick') doQuick(); });
let searchTimer=null;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f) return formInput(el);
  if(el.dataset.on==='search'){ UI.q=el.value; clearTimeout(searchTimer); searchTimer=setTimeout(()=>{ const b=$('#listBody'); if(b) b.innerHTML=listBody(); },150); return; }
  if(el.hasAttribute('data-money')){ const d=el.value.replace(/[^\d]/g,'').replace(/^0+/,'').slice(0,12); el.value=d?fmt(+d):''; }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f) return formInput(el);
  if(el.dataset.cfg){ CFG[el.dataset.cfg]=el.value.trim(); saveCFG(); toast('저장했어요'); return; }
  if(el.name==='ocr'){ CFG.ocr=el.value; saveCFG(); const g=$('#ocrGemini'), c=$('#ocrClaude'); if(g) g.hidden=CFG.ocr!=='gemini'; if(c) c.hidden=CFG.ocr!=='claude'; const o=$('#connOut'); if(o) o.textContent=''; return; }
  if(el.id==='fileCam'||el.id==='fileGal'){ const fs=Array.from(el.files||[]); el.value=''; if(fs.length) startImages(fs); return; }
  if(el.id==='fileCsv'){ const f=el.files[0]; el.value=''; if(f) csvIn(f).catch(err=>toast('CSV를 읽지 못했어요: '+errMsg(err),'err')); return; }
  if(el.id==='fileJson'){ const f=el.files[0]; el.value=''; if(f) jsonIn(f).catch(err=>toast('백업을 읽지 못했어요: '+errMsg(err),'err')); return; }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d.dataset&&d.dataset.sec){ if(d.open) UI.openSec.add(d.dataset.sec); else UI.openSec.delete(d.dataset.sec); } },true);
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme()); }catch(e){}

/* =====================================================================
   21) 시작
   ===================================================================== */
applyTheme(); setupPWA();
if(CFG.pinHash) lockApp(); else runFixed();
render();

</script>
</body>
</html>
